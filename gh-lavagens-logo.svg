<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600">
  <defs>
    <!-- Gradiente azul principal -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1" />
    </linearGradient>
    <!-- Gradiente verde -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2e7d32;stop-opacity:1" />
    </linearGradient>
    <!-- Gradiente para o ícone do sofá -->
    <linearGradient id="sofaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565c0;stop-opacity:1" />
    </linearGradient>
    <!-- Gradiente do círculo superior -->
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e88e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1" />
    </linearGradient>
    <!-- Sombra suave -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Fundo branco -->
  <rect width="500" height="600" fill="white"/>

  <!-- ===== ÍCONE SUPERIOR - Sofá dentro de círculo com ondas ===== -->
  <g transform="translate(250, 110)" filter="url(#shadow)">
    <!-- Círculo com onda -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="url(#circleGrad)" stroke-width="8"/>
    <!-- Onda decorativa no círculo -->
    <path d="M -40 15 Q -20 -10 0 5 T 40 15" fill="none" stroke="#42a5f5" stroke-width="3" opacity="0.6"/>
    
    <!-- Sofá -->
    <rect x="-22" y="-8" width="44" height="22" rx="5" ry="5" fill="#1e88e5" opacity="0.9"/>
    <rect x="-25" y="-12" width="50" height="10" rx="4" ry="4" fill="#2196f3" opacity="0.9"/>
    <!-- Encosto do sofá -->
    <rect x="-20" y="-28" width="40" height="20" rx="4" ry="4" fill="#1565c0" opacity="0.8"/>
    <!-- Braços do sofá -->
    <rect x="-27" y="-10" width="7" height="26" rx="3" ry="3" fill="#1976d2" opacity="0.9"/>
    <rect x="20" y="-10" width="7" height="26" rx="3" ry="3" fill="#1976d2" opacity="0.9"/>
    
    <!-- Gotas d'água -->
    <path d="M 15 -35 Q 18 -28 15 -25 Q 12 -28 15 -35" fill="#42a5f5" opacity="0.8"/>
    <path d="M -18 -32 Q -20 -26 -18 -23 Q -16 -26 -18 -32" fill="#64b5f6" opacity="0.7"/>
    
    <!-- Brilhos (stars) -->
    <path d="M 25 -30 L 27 -25 L 32 -23 L 27 -21 L 25 -16 L 23 -21 L 18 -23 L 23 -25 Z" fill="#90caf9" opacity="0.9"/>
    <path d="M -30 -25 L -31 -22 L -28 -21 L -31 -20 L -32 -17 L -33 -20 L -36 -21 L -33 -22 Z" fill="#90caf9" opacity="0.8"/>
  </g>

  <!-- ===== LETRA "G" ===== -->
  <g filter="url(#shadow)">
    <!-- G principal -->
    <path d="M 230 230 
             C 175 230, 140 265, 140 315 
             C 140 365, 175 400, 230 400
             C 275 400, 305 375, 310 340
             L 260 340 
             C 255 360, 235 375, 210 375
             C 180 375, 165 355, 165 330
             C 165 305, 180 285, 210 280
             C 230 276, 245 285, 255 300
             L 255 330 
             L 310 330 
             L 310 290
             C 305 255, 275 230, 230 230 Z" 
          fill="url(#blueGrad)"/>
    <!-- Detalhe verde na G -->
    <path d="M 155 285 
             C 160 260, 180 245, 205 240
             C 195 250, 175 265, 165 285
             C 160 300, 165 315, 175 325
             C 170 310, 160 295, 155 285 Z" 
          fill="url(#greenGrad)" opacity="0.8"/>
    <!-- Gota d'água na G -->
    <path d="M 210 300 Q 218 315 210 325 Q 202 315 210 300" fill="#42a5f5" opacity="0.9"/>
    <!-- Brilho na G -->
    <path d="M 195 310 L 197 315 L 202 316 L 197 318 L 195 323 L 193 318 L 188 316 L 193 315 Z" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- ===== LETRA "H" ===== -->
  <g filter="url(#shadow)">
    <!-- H principal - coluna esquerda -->
    <rect x="270" y="230" width="25" height="170" rx="5" ry="5" fill="url(#blueGrad)"/>
    <!-- H - coluna direita -->
    <rect x="345" y="230" width="25" height="170" rx="5" ry="5" fill="url(#greenGrad)"/>
    <!-- H - travessão -->
    <rect x="270" y="295" width="100" height="25" rx="4" ry="4" fill="url(#blueGrad)" opacity="0.85"/>
    
    <!-- Detalhe de escudo na H -->
    <path d="M 345 260 L 370 255 L 395 260 L 395 290 L 370 300 L 345 290 Z" 
          fill="#1e88e5" opacity="0.3"/>
    <path d="M 348 263 L 370 258 L 392 263 L 392 287 L 370 296 L 348 287 Z" 
          fill="none" stroke="#42a5f5" stroke-width="1.5" opacity="0.5"/>
    
    <!-- Onda decorativa cruzando as letras -->
    <path d="M 150 340 Q 200 320 250 340 T 350 330 T 400 340" 
          fill="none" stroke="#42a5f5" stroke-width="6" opacity="0.5" stroke-linecap="round"/>
    <path d="M 150 340 Q 200 320 250 340 T 350 330 T 400 340" 
          fill="none" stroke="#64b5f6" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  </g>

  <!-- ===== TEXTO "GH LAVAGENS" ===== -->
  <text x="250" y="470" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="bold" fill="#0d47a1">
    GH <tspan fill="#1e88e5">LAVAGENS</tspan>
  </text>

  <!-- Linha verde decorativa -->
  <line x1="80" y1="490" x2="420" y2="490" stroke="#4caf50" stroke-width="3"/>

  <!-- ===== SUBTÍTULO ===== -->
  <text x="250" y="525" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1e88e5" font-weight="normal">
    HIGIENIZAÇÃO &amp; IMPERMEABILIZAÇÃO DE ESTOFADOS
  </text>
</svg>

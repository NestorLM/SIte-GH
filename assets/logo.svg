<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <!-- Gradiente azul principal -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B4DB"/>
      <stop offset="100%" style="stop-color:#005C9F"/>
    </linearGradient>

    <!-- Gradiente verde -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43E97B"/>
      <stop offset="100%" style="stop-color:#0BA361"/>
    </linearGradient>

    <!-- Gradiente azul escuro -->
    <linearGradient id="blueDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0073CF"/>
      <stop offset="100%" style="stop-color:#003D6B"/>
    </linearGradient>

    <!-- Gradiente da gota -->
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4FC3F7"/>
      <stop offset="50%" style="stop-color:#0288D1"/>
      <stop offset="100%" style="stop-color:#01579B"/>
    </linearGradient>

    <!-- Gradiente do escudo -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4FC3F7"/>
      <stop offset="100%" style="stop-color:#0288D1"/>
    </linearGradient>

    <!-- Gradiente do sofá -->
    <linearGradient id="sofaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43E97B"/>
      <stop offset="100%" style="stop-color:#005C9F"/>
    </linearGradient>

    <!-- Gradiente do arco superior -->
    <linearGradient id="arcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#003D6B"/>
      <stop offset="50%" style="stop-color:#0073CF"/>
      <stop offset="100%" style="stop-color:#4FC3F7"/>
    </linearGradient>

    <!-- Gradiente do "G" -->
    <linearGradient id="gGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4FC3F7"/>
      <stop offset="40%" style="stop-color:#0073CF"/>
      <stop offset="100%" style="stop-color:#003D6B"/>
    </linearGradient>

    <!-- Gradiente do "H" -->
    <linearGradient id="hGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4FC3F7"/>
      <stop offset="50%" style="stop-color:#0073CF"/>
      <stop offset="100%" style="stop-color:#0BA361"/>
    </linearGradient>

    <!-- Gradiente da onda que conecta G e H -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0073CF"/>
      <stop offset="50%" style="stop-color:#00B4DB"/>
      <stop offset="100%" style="stop-color:#4FC3F7"/>
    </linearGradient>

    <!-- Filtro de sombra suave -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#003D6B" flood-opacity="0.15"/>
    </filter>

    <!-- Brilho para estrelas -->
    <radialGradient id="sparkleGrad">
      <stop offset="0%" style="stop-color:#E0F7FA;stop-opacity:1"/>
      <stop offset="40%" style="stop-color:#4FC3F7;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0288D1;stop-opacity:0"/>
    </radialGradient>

    <!-- Gradiente para bolhas -->
    <radialGradient id="bubbleGrad" cx="35%" cy="35%">
      <stop offset="0%" style="stop-color:#E1F5FE"/>
      <stop offset="100%" style="stop-color:#4FC3F7"/>
    </radialGradient>
  </defs>

  <!-- ===== ÍCONE SUPERIOR (círculo com sofá) ===== -->
  <g transform="translate(400, 200)" filter="url(#shadow)">
    <!-- Círculo de fundo -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="url(#arcGrad)" stroke-width="18"/>

    <!-- Arco decorativo superior -->
    <path d="M -95 -65 Q -120 0 -65 95" fill="none" stroke="url(#arcGrad)" stroke-width="14" stroke-linecap="round" opacity="0.6"/>

    <!-- Sofá central -->
    <g transform="translate(0, -5)">
      <!-- Encosto do sofá -->
      <path d="M -65 -25 Q -68 -55 -50 -60 L 50 -60 Q 68 -55 65 -25 L 65 -10 L -65 -10 Z"
            fill="url(#sofaGrad)" opacity="0.9"/>
      <!-- Assento -->
      <path d="M -70 -10 Q -72 5 -68 10 L 68 10 Q 72 5 70 -10 Z"
            fill="url(#sofaGrad)"/>
      <!-- Braço esquerdo -->
      <path d="M -70 -10 Q -80 -5 -78 10 L -68 10 Q -72 5 -70 -10 Z"
            fill="url(#sofaGrad)" opacity="0.8"/>
      <!-- Braço direito -->
      <path d="M 70 -10 Q 80 -5 78 10 L 68 10 Q 72 5 70 -10 Z"
            fill="url(#sofaGrad)" opacity="0.8"/>
      <!-- Pés -->
      <rect x="-50" y="12" width="10" height="12" rx="3" fill="#005C9F" opacity="0.7"/>
      <rect x="40" y="12" width="10" height="12" rx="3" fill="#005C9F" opacity="0.7"/>
    </g>

    <!-- Gota d'água acima do sofá -->
    <path d="M 0 -85 Q 12 -65 12 -50 Q 12 -38 0 -38 Q -12 -38 -12 -50 Q -12 -65 0 -85 Z"
          fill="url(#dropGrad)"/>
    <!-- Brilho na gota -->
    <ellipse cx="-3" cy="-58" rx="3" ry="5" fill="#E1F5FE" opacity="0.7" transform="rotate(-20, -3, -58)"/>

    <!-- Bolhas -->
    <circle cx="25" cy="-40" r="5" fill="url(#bubbleGrad)" opacity="0.6"/>
    <circle cx="32" cy="-50" r="3.5" fill="url(#bubbleGrad)" opacity="0.5"/>

    <!-- Estrelas/brilhos -->
    <g transform="translate(40, -80)">
      <path d="M 0 -12 Q 2 -3 12 0 Q 2 3 0 12 Q -2 3 -12 0 Q -2 -3 0 -12 Z" fill="#4FC3F7" opacity="0.8"/>
    </g>
    <g transform="translate(55, -55) scale(0.6)">
      <path d="M 0 -12 Q 2 -3 12 0 Q 2 3 0 12 Q -2 3 -12 0 Q -2 -3 0 -12 Z" fill="#43E97B" opacity="0.7"/>
    </g>
    <g transform="translate(35, -95) scale(0.5)">
      <path d="M 0 -12 Q 2 -3 12 0 Q 2 3 0 12 Q -2 3 -12 0 Q -2 -3 0 -12 Z" fill="#4FC3F7" opacity="0.6"/>
    </g>
  </g>

  <!-- ===== LETRAS "GH" ===== -->
  <g transform="translate(400, 540)" filter="url(#shadow)">

    <!-- Letra G -->
    <g>
      <!-- Arco externo do G -->
      <path d="M -180 -120 Q -220 -120 -230 -90 L -260 -90 L -260 60 L -230 90 Q -220 120 -180 120
               Q -140 120 -120 100 L -120 50 L -170 50 L -170 80 Q -150 95 -130 95
               Q -100 95 -90 70 L -90 40 L -90 -40 L -90 -70
               Q -90 -100 -120 -100 Q -150 -100 -160 -80 L -130 -80
               Q -120 -95 -95 -95 Q -70 -95 -65 -70 L -65 -40 L -180 -40
               Q -180 -100 -180 -120 Z"
            fill="url(#gGrad)"/>

      <!-- Gota dentro do G -->
      <g transform="translate(-140, 10)">
        <path d="M 0 -35 Q 10 -20 10 -10 Q 10 -2 0 6 Q -10 -2 -10 -10 Q -10 -20 0 -35 Z"
              fill="url(#dropGrad)"/>
        <ellipse cx="-3" cy="-20" rx="2.5" ry="4" fill="#E1F5FE" opacity="0.7" transform="rotate(-20, -3, -20)"/>
      </g>

      <!-- Brilho dentro do G -->
      <g transform="translate(-105, -60) scale(0.7)">
        <path d="M 0 -12 Q 2 -3 12 0 Q 2 3 0 12 Q -2 3 -12 0 Q -2 -3 0 -12 Z" fill="#43E97B" opacity="0.6"/>
      </g>

      <!-- Arco verde decorativo no topo do G -->
      <path d="M -180 -115 Q -160 -125 -130 -120" fill="none" stroke="url(#greenGrad)" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
    </g>

    <!-- Letra H -->
    <g>
      <!-- Perna esquerda -->
      <rect x="60" y="-120" width="55" height="240" rx="12" fill="url(#hGrad)"/>
      <!-- Perna direita -->
      <rect x="200" y="-120" width="55" height="240" rx="12" fill="url(#hGrad)"/>

      <!-- Travessão central com escudo -->
      <rect x="50" y="-30" width="215" height="40" rx="8" fill="url(#hGrad)"/>

      <!-- Escudo no H -->
      <g transform="translate(250, 20)">
        <path d="M 0 -45 L 40 -30 L 40 15 Q 40 50 0 65 Q -40 50 -40 15 L -40 -30 Z"
              fill="url(#shieldGrad)" opacity="0.85"/>
        <!-- Brilho no escudo -->
        <path d="M -5 -35 L 20 -25 L 20 10 Q 20 35 -5 48" fill="none" stroke="#E1F5FE" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
      </g>

      <!-- Onda que conecta G e H -->
      <path d="M 30 -10 Q 45 -25 60 -10" fill="none" stroke="url(#waveGrad)" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- Onda decorativa passando por baixo -->
    <path d="M -240 140 Q -150 170 -50 150 Q 50 130 150 155 Q 220 170 280 145"
          fill="none" stroke="url(#waveGrad)" stroke-width="12" stroke-linecap="round" opacity="0.5"/>

    <!-- Estrelas decorativas -->
    <g transform="translate(290, -100) scale(0.8)">
      <path d="M 0 -12 Q 2 -3 12 0 Q 2 3 0 12 Q -2 3 -12 0 Q -2 -3 0 -12 Z" fill="#4FC3F7" opacity="0.5"/>
    </g>
    <g transform="translate(-210, -100) scale(0.6)">
      <path d="M 0 -12 Q 2 -3 12 0 Q 2 3 0 12 Q -2 3 -12 0 Q -2 -3 0 -12 Z" fill="#43E97B" opacity="0.4"/>
    </g>
  </g>
</svg>

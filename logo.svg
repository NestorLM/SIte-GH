<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Gradiente para o círculo vermelho -->
    <radialGradient id="redGrad" cx="50%" cy="50%" r="50%" fx="45%" fy="45%">
      <stop offset="0%" style="stop-color:#e63946;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b71c2c;stop-opacity:1" />
    </radialGradient>
    
    <!-- Gradiente para o ícone do aspirador -->
    <linearGradient id="vacuumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Sombra suave -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Brilho -->
    <radialGradient id="shine" cx="40%" cy="35%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Fundo branco circular -->
  <circle cx="200" cy="200" r="195" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Círculo vermelho principal -->
  <circle cx="200" cy="170" r="100" fill="url(#redGrad)"/>
  
  <!-- Efeito de brilho no círculo -->
  <circle cx="200" cy="170" r="100" fill="url(#shine)"/>
  
  <!-- Ícone do aspirador estilizado -->
  <g transform="translate(200, 170)" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.2))">
    <!-- Corpo principal do aspirador -->
    <rect x="-35" y="-50" width="70" height="90" rx="10" fill="url(#vacuumGrad)"/>
    
    <!-- Topo do aspirador (cabo) -->
    <path d="M-25,-50 L-25,-65 Q-25,-72 -18,-72 L18,-72 Q25,-72 25,-65 L25,-50 Z" fill="#e0e0e0"/>
    <path d="M-15,-72 L-15,-80 Q-15,-85 -10,-85 L10,-85 Q15,-85 15,-80 L15,-72 Z" fill="#d0d0d0"/>
    
    <!-- Bocal de sucção -->
    <rect x="-40" y="38" width="80" height="15" rx="5" fill="#cccccc"/>
    <rect x="-30" y="50" width="60" height="8" rx="3" fill="#b0b0b0"/>
    
    <!-- Detalhe frontal (entrada de ar) -->
    <ellipse cx="0" cy="10" rx="25" ry="30" fill="#f8f8f8" stroke="#ddd" stroke-width="1"/>
    
    <!-- Linhas de detalhe no corpo -->
    <line x1="-20" y1="-20" x2="20" y2="-20" stroke="#e8e8e8" stroke-width="1.5"/>
    <line x1="-20" y1="-10" x2="20" y2="-10" stroke="#e8e8e8" stroke-width="1.5"/>
    
    <!-- Botão ligar -->
    <circle cx="0" cy="-35" r="8" fill="#e63946"/>
    <circle cx="0" cy="-35" r="5" fill="#ff6b6b"/>
    
    <!-- Fio elétrico -->
    <path d="M35,-10 Q55,-5 60,15 Q65,35 55,50" fill="none" stroke="#d0d0d0" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Escova inferior -->
    <rect x="-25" y="53" width="50" height="5" rx="2" fill="#a0a0a0"/>
  </g>
  
  <!-- Texto "GH" em baixo do círculo vermelho (dentro do círculo branco) -->
  <text x="200" y="310" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="700" fill="#1a1a1a" text-anchor="middle" letter-spacing="4">GH</text>
  
  <!-- Texto "LAVAGENS" -->
  <text x="200" y="345" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="600" fill="#e63946" text-anchor="middle" letter-spacing="8">LAVAGENS</text>
  
  <!-- Linha decorativa -->
  <line x1="120" y1="358" x2="280" y2="358" stroke="#e63946" stroke-width="2" opacity="0.5"/>
  
  <!-- Subtítulo -->
  <text x="200" y="378" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#666666" text-anchor="middle" letter-spacing="3">LIMPEZA &amp; IMPERMEABILIZAÇÃO</text>
</svg>
